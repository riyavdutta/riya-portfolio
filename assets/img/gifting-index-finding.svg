<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Classics get gifted. Cult houses get chosen."><rect width="400" height="500" rx="22" fill="#f4efe6" stroke="#800020" stroke-width="4"/><text x="36" y="70" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="600" font-size="15" letter-spacing="2.5" fill="#7d726b">THE FINDING</text><text x="36" y="170" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-2" fill="#800020">Classics get</text><text x="36" y="232" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-2" fill="#800020">gifted. Cult</text><text x="36" y="294" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-2" fill="#800020">houses get</text><text x="36" y="356" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="54" letter-spacing="-2" fill="#800020">chosen.</text><text x="36" y="440" font-family="Source Serif 4, Georgia, serif" font-style="italic" font-size="22" fill="#7d726b">Every December, 2018–2025</text></svg>