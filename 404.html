<script>
var DeskLayout = class extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var path = '/' + (window.location.pathname.split('/').pop() || 'somewhere');
    return {
      badPath: path.length > 26 ? path.slice(0, 24) + '…' : path,
      envClass: s.bouncing ? 'bounce' : '',
      status: s.tries ? ('Attempt ' + (s.tries + 1) + ': still no one at this address.') : '',
      resend: function () {
        self.setState({ bouncing: true });
        setTimeout(function () { self.setState({ bouncing: false, tries: ((self.state && self.state.tries) || 0) + 1 }); }, 900);
      }
    };
  }
}
;
